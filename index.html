<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신랑측 피로연 안내</title>

<!-- 카카오톡/문자 등으로 링크 공유 시 미리보기에 쓰이는 태그입니다. -->
<meta property="og:type" content="website">
<meta property="og:title" content="신랑측 피로연 안내">
<meta property="og:description" content="귀한 발걸음으로 두 사람의 앞날을 축복해 주시면 감사하겠습니다.">
<meta property="og:image" content="https://yeoneon.github.io/wedding-teaser/assets/wedding-teaser-party.png">
<meta property="og:url" content="https://yeoneon.github.io/wedding-teaser/">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  /* 안내문 이미지의 배경색과 맞춰서, 화면이 더 길어도 이음새 없이 이어지게 합니다. */
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #e2cfc8;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }

  .card {
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background: #e2cfc8;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .poster {
    display: block;
    width: 100%;
    height: auto;
  }

  .map {
    padding: 4px 24px 40px;
    text-align: center;
  }

  .map-place {
    margin-bottom: 14px;
    color: #4a3b37;
    font-size: 15px;
    letter-spacing: 0.02em;
  }

  .map-button {
    display: block;
    padding: 16px 20px;
    border-radius: 999px;
    background: #4a3b37;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  .map-button:active {
    opacity: 0.85;
  }

  @media (min-width: 481px) {
    body {
      display: flex;
      justify-content: center;
      padding: 32px 0;
    }
    .card {
      min-height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }
  }
</style>
</head>
<body>
  <div class="card">
    <img class="poster" src="assets/wedding-teaser-party.png"
         alt="신랑측 피로연 안내. 거리가 멀어 예식에 참석하기 어려운 분들을 위해 혼례에 앞서 피로연 자리를 마련하였습니다. 귀한 발걸음으로 두 사람의 앞날을 축복해 주시면 감사하겠습니다. 혼주 정권화·김윤자, 신랑 정연언·신부 방주원. 일시 2027년 12월 19일(토) 오전 11시, 장소 합천 대양면 복지회관.">

    <div class="map">
      <p class="map-place">합천 대양면 복지회관</p>
      <a class="map-button" href="https://naver.me/FbqlNj9m" target="_blank" rel="noopener">네이버 지도에서 위치 보기</a>
    </div>
  </div>
</body>
</html>
