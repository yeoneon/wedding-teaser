<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신랑측 피로연 안내</title>

<!-- 카카오톡/문자 등으로 링크 공유 시 미리보기에 쓰이는 태그입니다. -->
<meta property="og:type" content="website">
<meta property="og:title" content="신랑측 피로연 안내">
<meta property="og:description" content="귀한 발걸음으로 두 사람의 앞날을 축복해 주시면 감사하겠습니다.">
<meta property="og:image" content="https://yeoneon.github.io/wedding-teaser/assets/wedding-teaser-party.png">
<meta property="og:url" content="https://yeoneon.github.io/wedding-teaser/">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  /* 안내문 이미지의 배경색과 맞춰서, 화면이 더 길어도 이음새 없이 이어지게 합니다. */
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #e2cfc8;
  }

  .card {
    position: relative;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background: #e2cfc8;
    display: flex;
    align-items: center;
  }

  .poster {
    display: block;
    width: 100%;
    height: auto;
  }

  #confetti {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  @media (min-width: 481px) {
    body {
      display: flex;
      justify-content: center;
      padding: 32px 0;
    }
    .card {
      min-height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }
  }
</style>
</head>
<body>
  <div class="card">
    <img class="poster" src="assets/wedding-teaser-party.png"
         alt="신랑측 피로연 안내. 거리가 멀어 예식에 참석하기 어려운 분들을 위해 혼례에 앞서 피로연 자리를 마련하였습니다. 귀한 발걸음으로 두 사람의 앞날을 축복해 주시면 감사하겠습니다. 혼주 정권화·김윤자, 신랑 정연언·신부 방주원. 일시 2027년 12월 19일(토) 오전 11시, 장소 합천 대양면 복지회관.">
    <canvas id="confetti"></canvas>
  </div>

<script>
(function () {
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var card = canvas.parentElement;
  var colors = ['#d4af37', '#f2a3ab', '#ffffff', '#9fc7a3', '#f6df8e'];
  var particles = [];
  var pendingBursts = 0;

  function resize() {
    canvas.width = card.clientWidth;
    canvas.height = card.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function burst(x, y) {
    var count = 55;
    for (var i = 0; i < count; i++) {
      var angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      var speed = 2 + Math.random() * 4;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 2.5 + Math.random() * 2.5,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 1,
        decay: 0.012 + Math.random() * 0.012
      });
    }
  }

  var running = false;
  function loop() {
    running = true;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.vy += 0.06;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (particles.length > 0 || pendingBursts > 0) {
      requestAnimationFrame(loop);
    } else {
      running = false;
    }
  }

  function scheduleBursts() {
    var points = [
      { x: 0.28, y: 0.38 },
      { x: 0.72, y: 0.34 },
      { x: 0.5, y: 0.46 }
    ];
    pendingBursts = points.length;
    points.forEach(function (pt, i) {
      setTimeout(function () {
        burst(canvas.width * pt.x, canvas.height * pt.y);
        pendingBursts--;
        if (!running) loop();
      }, i * 350);
    });
  }

  window.addEventListener('load', function () {
    resize();
    setTimeout(scheduleBursts, 200);
  });
})();
</script>
</body>
</html>
