<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모바일 청첩장 준비중</title>

<!-- 카카오톡/문자 등으로 링크 공유 시 미리보기에 쓰이는 태그입니다.
     아래 og:url, og:image는 배포 후 실제 주소로 바꿔주세요. -->
<meta property="og:type" content="website">
<meta property="og:title" content="모바일 청첩장 준비중">
<meta property="og:description" content="현재 모바일 청첩장은 준비중입니다.">
<meta property="og:image" content="https://yeoneon.github.io/wedding-teaser/assets/wedding-teaser-image.jpg">
<meta property="og:url" content="https://yeoneon.github.io/wedding-teaser/">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #e9e7e2;
    font-family: "Nanum Myeongjo", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  }

  .card {
    position: relative;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background-image: url("assets/wedding-teaser-image.jpg");
    background-size: cover;
    background-position: center;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.28);
  }

  #confetti {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  @media (min-width: 481px) {
    body {
      display: flex;
      justify-content: center;
      padding: 32px 0;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }
  }

  .message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    width: 100%;
    text-align: center;
    padding: 0 24px;
    color: #fff;
    font-size: clamp(19px, 5vw, 24px);
    line-height: 1.7;
    letter-spacing: 0.02em;
    text-shadow: 0 2px 14px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
  <div class="card">
    <canvas id="confetti"></canvas>
    <p class="message">현재 모바일 청첩장은<br>준비중입니다.</p>
  </div>

<script>
(function () {
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var card = canvas.parentElement;
  var colors = ['#d4af37', '#f2a3ab', '#ffffff', '#9fc7a3', '#f6df8e'];
  var particles = [];
  var pendingBursts = 0;

  function resize() {
    canvas.width = card.clientWidth;
    canvas.height = card.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function burst(x, y) {
    var count = 55;
    for (var i = 0; i < count; i++) {
      var angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      var speed = 2 + Math.random() * 4;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 2.5 + Math.random() * 2.5,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 1,
        decay: 0.012 + Math.random() * 0.012
      });
    }
  }

  var running = false;
  function loop() {
    running = true;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.vy += 0.06;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (particles.length > 0 || pendingBursts > 0) {
      requestAnimationFrame(loop);
    } else {
      running = false;
    }
  }

  function scheduleBursts() {
    var points = [
      { x: 0.28, y: 0.38 },
      { x: 0.72, y: 0.34 },
      { x: 0.5, y: 0.46 }
    ];
    pendingBursts = points.length;
    points.forEach(function (pt, i) {
      setTimeout(function () {
        burst(canvas.width * pt.x, canvas.height * pt.y);
        pendingBursts--;
        if (!running) loop();
      }, i * 350);
    });
  }

  window.addEventListener('load', function () {
    setTimeout(scheduleBursts, 200);
  });
})();
</script>
</body>
</html>
